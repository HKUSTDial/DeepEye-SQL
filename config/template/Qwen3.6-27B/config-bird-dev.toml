########## Logger configuration ##########
[logger]
print_level = "INFO"

########## Run output configuration ##########
[run]
save_root = "workspace/runs"
exp_name = "bird-dev"
parallelism = 16
embedding_batch_size = 256
llm_timeout = 300
progress_log_interval = 50
checkpoint_interval = 20
default_llm_profile = "qwen36_thinking"

########## LLM profiles ##########
[llm_profiles.qwen36_thinking]
model = "Qwen3.6-27B"
base_url = "your-llm-model-base-url"
api_key = "your-llm-api-key"
max_tokens = 16384
temperature = 0.6
n_call_strategy = "single"
api_type = "openai"
max_model_len = 65536
extra_body = { top_p = 0.95, top_k = 20, min_p = 0.0, presence_penalty = 0.0, repetition_penalty = 1.0, chat_template_kwargs = { enable_thinking = true } }

[llm_profiles.qwen36_instruct]
model = "Qwen3.6-27B"
base_url = "your-llm-model-base-url"
api_key = "your-llm-api-key"
max_tokens = 16384
temperature = 0.7
n_call_strategy = "single"
api_type = "openai"
max_model_len = 65536
extra_body = { top_p = 0.8, top_k = 20, min_p = 0.0, presence_penalty = 1.5, repetition_penalty = 1.0, chat_template_kwargs = { enable_thinking = false } }

########## Default embedding configuration ##########
[embedding]
api_type = "openai"
embedding_model_name_or_path = "Qwen3-Embedding-0.6B"
base_url = "your-embedding-model-base-url"
api_key = "your-embedding-api-key"

########## Dataset configuration ##########
[dataset]
type = "bird"
split = "dev"
root_path = "data/bird"
sql_execution_timeout = 600

########## Vector database configuration ##########
[vector_database]
max_value_length = 100
lower_meta_data = true
build_backend = "local_index"

########## Few-shot index configuration ##########
[few_shot_index]
num_examples = 7
question_weight = 0.6
sql_weight = 0.4
similarity_device = "cuda:0"
force_rebuild = false
llm_profile = "qwen36_instruct"

[few_shot_index.preliminary_sql]
enabled = true
dc_sampling_budget = 4
skeleton_sampling_budget = 4
llm_profile = "qwen36_thinking"

########## Value retrieval configuration ##########
[value_retrieval]
max_values_per_column = 5
backend = "local_index"
local_index_device = "cuda:0"
llm_profile = "qwen36_instruct"

########## Schema linking configuration ##########
[schema_linking]
direct_linking_sampling_budget = 4
reversed_linking_sampling_budget = 4
value_distance_threshold = 0.05
llm_profile = "qwen36_thinking"

########## SQL generation configuration ##########
[sql_generation]
dc_sampling_budget = 4
skeleton_sampling_budget = 4
icl_sampling_budget = 4
llm_profile = "qwen36_thinking"

########## SQL revision configuration ##########
[sql_revision]
checker_sampling_budget = 5
llm_profile = "qwen36_thinking"

########## SQL selection configuration ##########
[sql_selection]
filter_top_k_sql = 2
evaluator_sampling_budget = 5
shortcut_consistency_score_threshold = 0.6
llm_profile = "qwen36_thinking"

########## LLM extractor configuration ##########
[llm_extractor]
max_retry = 5
