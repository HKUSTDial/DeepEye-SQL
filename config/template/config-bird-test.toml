########## Logger configuration ##########
[logger]
print_level = "INFO"      # Console log level: DEBUG, INFO, WARNING, ERROR, CRITICAL

########## Run output configuration ##########
[run]
save_root = "workspace/runs"
exp_name = "bird-test"
parallelism = 8
embedding_batch_size = 128
llm_timeout = 300
progress_log_interval = 50
checkpoint_interval = 20

########## Default LLM configuration ##########
[llm]
model = "your-llm-model-name"
base_url = "your-llm-model-base-url"
api_key = "your-llm-api-key"
max_tokens = 4096
temperature = 0.7
api_type = "openai"
max_model_len = 128000

########## Default embedding configuration ##########
[embedding]
api_type = "openai"
embedding_model_name_or_path = "your-embedding-model-name"
base_url = "your-embedding-model-base-url"
api_key = "your-embedding-api-key"
embedding_device = "auto"   # auto | cpu | cuda | cuda:0

########## Dataset configuration ##########
[dataset]
type = "bird"
split = "test"
root_path = "data/bird"
# max_samples = 100       # Limit total samples to load (optional)
# max_samples_per_db = 5  # Limit samples per database (optional, None means load all samples from each database)

########## Vector database configuration ##########
[vector_database]
max_value_length = 100
lower_meta_data = true
build_backend = "local_index"   # chroma | local_index | both

########## Few-shot index configuration ##########
[few_shot_index]
num_examples = 5
question_weight = 0.6
sql_weight = 0.4
similarity_device = "cpu"  # cpu | auto | cuda | cuda:0
force_rebuild = false
# max_samples = 100       # Limit training examples to index (optional)
# max_samples_per_db = 2  # Limit indexed training examples per source database (optional)

[few_shot_index.llm]
max_tokens = 2048
temperature = 0.0

[few_shot_index.preliminary_sql]
enabled = false
dc_sampling_budget = 2
skeleton_sampling_budget = 2

[few_shot_index.preliminary_sql.llm]
temperature = 0.6

########## Value retrieval configuration ##########
[value_retrieval]
max_values_per_column = 5
backend = "local_index"   # use "chroma" to keep the original backend
local_index_device = "auto"   # auto | cpu | cuda | cuda:0 | cuda:1

########## Schema linking configuration ##########
[schema_linking]
direct_linking_sampling_budget = 4
reversed_linking_sampling_budget = 4
value_distance_threshold = 0.02

########## SQL generation configuration ##########
[sql_generation]
dc_sampling_budget = 4
skeleton_sampling_budget = 4
icl_sampling_budget = 4
# Optional static fallback. Leave unset to use dynamic examples from few-shot preparation.
# icl_few_shot_examples_path = "results/bird_test_few_shots.json"

########## SQL revision configuration ##########
[sql_revision]
checker_sampling_budget = 3

########## SQL selection configuration ##########
[sql_selection]
filter_top_k_sql = 2
evaluator_sampling_budget = 5
shortcut_consistency_score_threshold = 0.6

########## LLM extractor configuration ##########
[llm_extractor]
max_retry = 5
