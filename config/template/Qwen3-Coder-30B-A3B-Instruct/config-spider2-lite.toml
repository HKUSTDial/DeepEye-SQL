########## Logger configuration ##########
[logger]
print_level = "INFO"

########## Run output configuration ##########
[run]
save_root = "workspace/runs"
exp_name = "spider2-lite"
parallelism = 16
llm_timeout = 300
progress_log_interval = 50
checkpoint_interval = 20
default_llm_profile = "qwen3_coder_instruct"

########## LLM profiles ##########
[llm_profiles.qwen3_coder_instruct]
model = "Qwen3-Coder-30B-A3B-Instruct"
base_url = "your-llm-model-base-url"
api_key = "your-llm-api-key"
max_tokens = 16384
temperature = 0.7
n_call_strategy = "single"
api_type = "openai"
max_model_len = 262144
extra_body = { top_p = 0.8, top_k = 20, repetition_penalty = 1.05 }

########## Dataset configuration ##########
[dataset]
type = "spider2"
split = "lite"
root_path = "data/spider2-lite"
snowflake_credential_path = "snowflake_credential.json"
bigquery_credential_path = "bigquery_credential.json"
sql_execution_timeout = 600
max_value_example_length = 50

########## Schema linking configuration ##########
[schema_linking]
direct_linking_sampling_budget = 12
reversed_linking_sampling_budget = 12

########## SQL generation configuration ##########
[sql_generation]
dc_sampling_budget = 12
skeleton_sampling_budget = 12
icl_sampling_budget = 12

########## SQL revision configuration ##########
[sql_revision]
checker_sampling_budget = 16
checkers = ["SyntaxChecker", "ResultChecker"]

########## SQL selection configuration ##########
[sql_selection]
filter_top_k_sql = 2
evaluator_sampling_budget = 16
shortcut_consistency_score_threshold = 0.6

########## LLM extractor configuration ##########
[llm_extractor]
max_retry = 5
